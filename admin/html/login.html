<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>여신금융협회</title>
    <meta name="viewport" content="width=1920" />
    <link
      rel="stylesheet"
      href="../assets/vendor/flatpickr/4.6.13/flatpickr.css"
    />
    <link rel="stylesheet" href="../assets/css/common.css" />
    <link rel="stylesheet" href="../assets/css/layout.css" />
    <link rel="stylesheet" href="../assets/css/content.css" />
    <script defer src="../assets/vendor/flatpickr/4.6.13/flatpickr.js"></script>
    <script defer src="../assets/vendor/flatpickr/4.6.13/ko.js"></script>
    <script defer src="../assets/js/common.js"></script>
  </head>
  <body>
    <main class="admin_login">
      <section class="login_area">
        <div class="login_content">
          <img
            class="logo"
            src="../assets/images/logo.png"
            alt="여신금융협회"
          />
          <form class="login_box js_admin_login">
            <div class="login_heading">
              <h1 class="login_title">
                <span>여신금융협회</span> 등록 관리시스템 로그인
              </h1>
              <p class="login_desc">
                대출성 상품 모집인 등록 관리 시스템입니다.
              </p>
            </div>
            <div class="login_fields">
              <div class="field">
                <label for="admin_id">아이디</label>
                <input id="admin_id" type="text" />
              </div>
              <div class="field">
                <label for="admin_pw">비밀번호</label>
                <input id="admin_pw" type="password" />
              </div>
            </div>
            <button class="btn_login" type="submit">로그인</button>
            <div class="login_options">
              <label class="checkbox"
                ><input type="checkbox" checked /> 아이디 저장</label
              >
              <a href="javascript:;">회원가입</a>
            </div>
          </form>
        </div>
      </section>
      <div class="visual_area"></div>
    </main>
  </body>
</html>
