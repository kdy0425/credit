      <script>
        const questions = [
          "모집인 등록정보 변동보고 안내(개인 / 법인 공통)",
          "모집인 등록정보 변동보고 안내(법인)",
          "대출성상품 모집인 등록 처리절차 안내",
          "대출성상품 모집인 교육관련 안내",
          "대출성상품 모집인 교육관련 안내",
          "모집인 교육 이수 시 경력/신규 구분 관련 안내",
          "계약 금융회사 또는 소속 모집법인 변경 및 이직 시 처리절차",
          "휴대폰번호 변경 시 처리절차",
          "개명하거나, 주민등록번호가 변경된 경우 처리절차",
        ];

        const tableAnswer = `
                <table class="faq_table">
                    <colgroup>
                        <col style="width:33%">
                        <col style="width:33%">
                        <col style="width:33%">
                    </colgroup>
                    <thead>
                        <tr>
                            <th>변동사항</th>
                            <th>조치방안</th>
                            <th>상세내용</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>위탁 금융회사 추가·변경</td>
                            <td>정보변경</td>
                            <td>기존 위탁 금융회사 등록정보를 해지처리하고, 신규 위탁 금융회사는 기존 등록정보를 활용(다른 계약 불러오기)하여 추가</td>
                        </tr>
                        <tr>
                            <td>취급 상품(대출/리스할부) 추가·변경</td>
                            <td>등록 필요</td>
                            <td>추가나 변경하고자 하는 상품의 교육 이수 및 평가 인증 후 협회 등록 필요(등록 신청시 기존 등록정보 활용 가능)</td>
                        </tr>
                        <tr>
                            <td>개인 또는 법인의 대표자 및 임원이 결격사유가 생긴 경우</td>
                            <td>결격사유 발생일로부터 1개월 이내에 변동보고</td>
                            <td>정보변경 신청을 통해 변동보고</td>
                        </tr>
                    </tbody>
                </table>
            `;
        const defaultAnswer =
          "대출성상품 모집인 등록 전에 각 상품별 신규·경력별 해당 교육을 이수하고 필요한 평가를 통해 인증을 획득하여야 합니다.";
        const detailAnswer = `
                <div class="faq_answer_text">
                    <p>대출성상품 모집인은 등록 전에 각 상품(대출/리스・할부)별, 신규/경력별 해당 교육을 이수하고, 신규 모집인인 경우에는 평가를 통해 인증을 획득하여야 합니다.</p>
                    <p>대출모집인, 리스할부모집인을 겸업하는 경우에는 두 가지 교육과정을 모두 이수하여야하며, 신규 모집인인 경우 각각 평가를 통해 인증을 획득하여야 합니다.</p>
                    <p>오토론 취급 모집인은 금융소비자 보호에 관한 감독규정 제22조제1호바목에 따라 리스・할부와 유사한 금융상품으로 취급되어, 리스・할부 교육을 이수하고 신규 모집인인 경우 리스・할부 평가를 통해 인증을 획득한 후, 리스・할부 모집인으로 등록을 신청하면 됩니다.</p>
                </div>
            `;

        document.getElementById("faq_list").innerHTML = questions
          .map((question, index) => {
            const isOpen = index === 3 || index === 4;
            return `
                    <article class="faq_item ${isOpen ? "active" : ""}">
                        <button class="faq_q js_faq_toggle" type="button" aria-expanded="${isOpen}">${question}</button>
                        <div class="faq_a">
                            <div class="faq_answer_inner">${index === 3 ? tableAnswer : index === 4 ? detailAnswer : defaultAnswer}</div>
                        </div>
                    </article>
                `;
          })
          .join("");

        document.querySelectorAll(".js_faq_toggle").forEach((button) => {
          button.addEventListener("click", () => {
            const item = button.closest(".faq_item");
            const willOpen = !item.classList.contains("active");

            item.classList.toggle("active", willOpen);
            button.setAttribute("aria-expanded", String(willOpen));
          });
        });
      </script>
    </div>
