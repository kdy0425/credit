      <main class="site_main">
        <section class="account_shell" aria-labelledby="reset-password-title">
          <h1 class="account_title" id="reset-password-title">
            개인 비밀번호 재설정
          </h1>
          <form class="account_panel" action="reset_password_error.html">
            <div class="account_field_stack">
              <div class="account_field">
                <label for="reset-password">재설정 할 비밀번호</label>
                <input id="reset-password" type="password" />
              </div>
              <div class="account_field">
                <label for="reset-password-confirm">비밀번호 확인</label>
                <input id="reset-password-confirm" type="password" />
                <p class="account_error" id="reset-password-error-message">
                  ※ 비밀번호가 일치하지 않습니다.
                </p>
              </div>
            </div>
            <button class="btn_primary account_cta" type="submit">저장</button>
          </form>
        </section>
      </main>

      <div class="partner_bar">

          <a class="partner_item" href="javascript:;" title="신협"
            ><img src="../assets/images/partner-capital.png" alt="신협"
